name: VS-Latest-CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  ci:
    if: >-
      ! contains(toJSON(github.event.commits.*.message), '[skip ci]') &&
      ! contains(toJSON(github.event.commits.*.message), '[skip github]')
    name: windows-2025 (latest Visual Studio)
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - {toolset: '', arch: Win32, shared: OFF}
          - {toolset: '', arch: Win32, shared: ON}
          - {toolset: '', arch: x64, shared: OFF}
          - {toolset: '', arch: x64, shared: ON}
          - {toolset: '-T ClangCL', arch: Win32, shared: OFF}
          - {toolset: '-T ClangCL', arch: Win32, shared: ON}
          - {toolset: '-T ClangCL', arch: x64, shared: OFF}
          - {toolset: '-T ClangCL', arch: x64, shared: ON}
    steps:
    - name: checkout
      uses: actions/checkout@v7
    - name: Configure
      run: |
        cmake -S . -A ${{matrix.arch}} ${{matrix.toolset}} -DBUILD_SHARED_LIBS=${{matrix.shared}} -DSTREAMVBYTE_ENABLE_EXAMPLES=ON -DSTREAMVBYTE_ENABLE_TESTS=ON -DSTREAMVBYTE_WALL=ON -DSTREAMVBYTE_WERROR=ON -B build
    - name: Build Debug
      run: cmake --build build --config Debug --verbose
    - name: Build Release
      run: cmake --build build --config Release --verbose
    - name: Run Release tests
      run: |
        cd build
        ctest -C Release  --output-on-failure
    - name: Run Debug tests
      run: |
        cd build
        ctest -C Debug --output-on-failure
